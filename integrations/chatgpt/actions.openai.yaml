openapi: 3.1.0
info:
  title: Software Factory Action
  version: 0.1.0
  description: |
    ChatGPT Action schema for calling a hosted Software Factory instance.
    Replace the server URL with your deployed factory URL and configure API key
    authentication with header name `x-operator-token`.
servers:
  - url: https://YOUR_FACTORY_HOST
security:
  - OperatorToken: []
paths:
  /api/setup:
    get:
      operationId: getSetup
      summary: Read factory setup/runtime status.
      responses:
        '200':
          description: Setup status.
          content:
            application/json:
              schema:
                type: object
  /api/runs:
    get:
      operationId: listRuns
      summary: List Software Factory runs.
      responses:
        '200':
          description: Projected runs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunProjection'
    post:
      operationId: createRun
      summary: Create a Software Factory run from a prompt and/or PRD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '201':
          description: Run created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRunResponse'
        '200':
          description: Duplicate idempotency key returned the existing run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRunResponse'
  /api/runs/{runId}:
    get:
      operationId: getRun
      summary: Read one projected run.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Projected run.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    $ref: '#/components/schemas/RunProjection'
  /api/runs/{runId}/events:
    get:
      operationId: getRunEvents
      summary: Read the ordered ledger events for one run.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Ordered event log.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                  events:
                    type: array
                    items:
                      type: object
  /api/runs/{runId}/cancel:
    post:
      operationId: cancelRun
      summary: Cancel a run. Cancellation propagates to queued and active execution work.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expectedVersion
              properties:
                expectedVersion:
                  type: integer
                  minimum: 0
                reason:
                  type: string
      responses:
        '200':
          description: Run cancelled.
          content:
            application/json:
              schema:
                type: object
  /api/runs/{runId}/start:
    post:
      operationId: startRun
      summary: >-
        Start execution for a planned run. A dry-run preflight rehearsal must
        pass before the run-execution job is enqueued for the execution daemon;
        duplicate starts return the existing queue state.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionCommandRequest'
      responses:
        '202':
          description: Preflight passed and the execution job was enqueued.
          content:
            application/json:
              schema:
                type: object
        '200':
          description: Execution was already queued or active (idempotent repeat).
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Preflight failed, run not planned, or retry budget exhausted.
          content:
            application/json:
              schema:
                type: object
  /api/runs/{runId}/pause:
    post:
      operationId: pauseRun
      summary: Pause execution for a run (no new worker starts until resumed).
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionCommandRequest'
      responses:
        '200':
          description: Execution paused (or already paused).
          content:
            application/json:
              schema:
                type: object
  /api/runs/{runId}/resume:
    post:
      operationId: resumeRun
      summary: Resume a paused execution.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionCommandRequest'
      responses:
        '200':
          description: Execution resumed.
          content:
            application/json:
              schema:
                type: object
  /api/runs/{runId}/retry:
    post:
      operationId: retryRun
      summary: >-
        Retry a failed, blocked, or abandoned execution within the bounded
        retry budget, optionally focused on one ticket.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ExecutionCommandRequest'
                - type: object
                  properties:
                    ticketId:
                      type: string
      responses:
        '202':
          description: Retry enqueued.
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Nothing to retry or retry budget exhausted.
          content:
            application/json:
              schema:
                type: object
  /api/runs/{runId}/gates/rerun:
    post:
      operationId: rerunGates
      summary: Enqueue a quality-gate re-run job for a run.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionCommandRequest'
      responses:
        '202':
          description: Gate re-run enqueued.
          content:
            application/json:
              schema:
                type: object
  /api/runs/{runId}/execution:
    get:
      operationId: getExecution
      summary: >-
        Read the projected execution state for a run: queue job, lease,
        preflight outcome, and open interventions.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Projected execution state.
          content:
            application/json:
              schema:
                type: object
  /api/interventions:
    get:
      operationId: listInterventions
      summary: >-
        List the operator intervention queue across runs, filterable by run,
        kind, severity, blocking stage, and open-only.
      parameters:
        - name: runId
          in: query
          required: false
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - approval
              - missing_credentials
              - source_choice
              - unsafe_path
              - adapter_setup
              - deploy_setup
              - retry_choice
              - policy_block
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum:
              - info
              - success
              - warn
              - error
              - critical
        - name: blockingStage
          in: query
          required: false
          schema:
            type: string
        - name: open
          in: query
          required: false
          schema:
            type: string
            enum:
              - '1'
              - 'true'
      responses:
        '200':
          description: Projected intervention queue.
          content:
            application/json:
              schema:
                type: object
  /api/interventions/{interventionId}/resolve:
    post:
      operationId: resolveIntervention
      summary: Resolve one operator intervention with a resolution note.
      parameters:
        - name: interventionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resolution
              properties:
                resolution:
                  type: string
                note:
                  type: string
                expectedVersion:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Intervention resolved (or already resolved).
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    OperatorToken:
      type: apiKey
      in: header
      name: x-operator-token
      description: Value of the hosted factory's `SF_OPERATOR_TOKEN`.
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ExecutionCommandRequest:
      type: object
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: >-
            Optional optimistic-concurrency check; the command is rejected with
            409 when this is older than the run's current ledger version.
        reason:
          type: string
      additionalProperties: false
    CreateRunRequest:
      type: object
      properties:
        prompt:
          type: string
        prdRef:
          type: string
        prdText:
          type: string
        title:
          type: string
        mode:
          type: string
          enum:
            - plan-only
            - research-and-plan
            - research-plan-and-start
          description: >-
            plan-only (default) creates the blueprint; research-and-plan runs
            bounded research first; research-plan-and-start also records a
            start request that is preflighted and enqueued for the execution
            daemon.
        localFolder:
          type: string
        githubRepo:
          type: string
        selectedAdapter:
          type: string
        modelProfile:
          type: string
        reasoningEffort:
          type: string
        requestedWorkerCap:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
        reviewMode:
          type: string
          enum:
            - human
            - autonomous
        callerFamily:
          type: string
          enum:
            - api
            - codex
            - claude
        idempotencyKey:
          type: string
      additionalProperties: false
    CreateRunResponse:
      type: object
      properties:
        runId:
          type: string
        deduplicated:
          type: boolean
        run:
          $ref: '#/components/schemas/RunProjection'
    RunProjection:
      type: object
      properties:
        runId:
          type: string
        title:
          type: string
        status:
          type: string
        mode:
          type: string
        executionState:
          type: string
          description: >-
            not_requested | pending | queued | started | paused | blocked |
            completed | failed | cancelled | unavailable — derived from queue,
            preflight, and execution events on the ledger.
        executionReason:
          type: string
        reviewMode:
          type: string
        callerFamily:
          type: string
        plannedTicketCount:
          type: integer
        requestedWorkerCap:
          type: integer
        lastSequence:
          type: integer
        ledger:
          type: array
          items:
            type: object
