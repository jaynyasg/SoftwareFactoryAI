services:
  - type: web
    name: software-factory
    runtime: node
    plan: starter
    # SINGLE-INSTANCE ONLY (U11): the JSONL event ledger and the ledger-backed
    # execution queue do not support horizontal scaling. Do not raise this or
    # enable autoscaling until the database-backed event store + durable queue
    # land (see ARCHITECTURE.md "Hosted Scale Migration Seam" and
    # docs/runbooks/cloud-deployment.md "Scaling Limits And The Migration Seam").
    numInstances: 1
    buildCommand: corepack enable && corepack pnpm@10.27.0 install --frozen-lockfile && corepack pnpm@10.27.0 --filter @software-factory/web build
    startCommand: corepack pnpm@10.27.0 --filter @software-factory/web start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/setup
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: SF_RUNTIME
        value: cloud
      - key: SF_FACTORY_DIR
        value: /var/data/.factory
      - key: SF_OPERATOR_TOKEN
        generateValue: true
      - key: SF_PUBLIC_BASE_URL
        sync: false
      # Execution boots HELD by default: after every deploy/restart an operator
      # must open the Factory Floor and click "Resume execution" before queued
      # work runs. Uncomment to opt into unattended drain-on-start instead.
      # - key: SF_EXEC_AUTOSTART
      #   value: "1"
    disk:
      name: software-factory-ledger
      mountPath: /var/data
      sizeGB: 1
